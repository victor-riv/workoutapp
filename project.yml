# XcodeGen project spec — generates WorkoutTracker.xcodeproj on a Mac.
# Install:  brew install xcodegen
# Generate: xcodegen generate   (run from this directory)
name: WorkoutTracker
options:
  bundleIdPrefix: com.victor
  deploymentTarget:
    iOS: "17.0"

targets:
  WorkoutTracker:
    type: application
    platform: iOS
    sources:
      - path: WorkoutApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.victor.workouttracker
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    # HealthKit (later phase): uncomment when workout logging is added.
    # entitlements:
    #   path: WorkoutApp/WorkoutTracker.entitlements

  WorkoutTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WorkoutAppTests
    dependencies:
      - target: WorkoutTracker
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.victor.workouttracker.tests
